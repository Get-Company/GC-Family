name: Deploy GC-Family

on:
  push:
    tags:
      - "v*"

concurrency:
  group: gc-family-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: [self-hosted, linux, x64, gcfamily-deploy]
    environment: production
    env:
      APP_VERSION: ${{ github.ref_name }}
      COMPOSE_PROJECT_NAME: gc-family
      # Der selbstgehostete Runner läuft als Nutzer `runner`; das Ziel muss
      # daher außerhalb des nicht zugänglichen /root-Verzeichnisses liegen.
      APP_DIR: /home/runner/GC-Family
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Synchronize release to server directory
        run: rsync -a --delete --exclude .env "$GITHUB_WORKSPACE/" "$APP_DIR/"

      - name: Build and restart services
        working-directory: /root/GC-Family
        run: docker compose --env-file .env up -d --build --remove-orphans

      - name: Verify service
        run: >-
          curl --fail --silent --show-error
          -H 'X-Forwarded-Proto: https'
          http://127.0.0.1:4711/api/health
