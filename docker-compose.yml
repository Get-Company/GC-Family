# GC-Family — Produktions-/Server-Setup: Postgres + Django-Backend + Next.js.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gcfamily}
      POSTGRES_USER: ${DB_USER:-gcfamily}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gcfamily}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?bitte in .env setzen}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-gcfamily}
      DB_USER: ${DB_USER:-gcfamily}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?bitte in .env setzen}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-gcfamily}
      DB_USER: ${DB_USER:-gcfamily}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >-
        until python manage.py materialize_chores --horizon 21; do sleep 10; done;
        while sleep 3600; do python manage.py materialize_chores --horizon 21; done

  frontend:
    build:
      context: ./frontend
      args:
        # In das /api-Rewrite eingebacken (Backend über Servicenamen).
        BACKEND_URL: http://backend:8000
        # Wird vom GitHub-Tag in den sichtbaren Frontend-Build übernommen.
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    # Hinweis: Das /api-Rewrite-Ziel wird über das Build-Arg BACKEND_URL
    # (siehe build.args) zur Build-Zeit gesetzt, nicht zur Laufzeit.
    ports:
      # LAN-Zugriff für die direkte HTTP-Bereitstellung. Bei einem späteren
      # HTTPS-Reverse-Proxy wieder auf 127.0.0.1:4711:3000 begrenzen.
      - "4711:3000"

volumes:
  pgdata:
  staticfiles:
  media:
